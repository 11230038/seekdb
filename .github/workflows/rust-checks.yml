# Fast checks for every Rust workspace member without a full server build.
name: rust-checks

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'bazel/cargo*'
      - 'bazel/cxx.bzl'
      - 'MODULE.bazel'
      - '.github/workflows/rust-checks.yml'
      - '.github/actions/setup-rust/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Prepare generated interfaces and C++ bridges
        run: |
          ./build.py init
          ./build.py build //rust:generated_headers //rust:bridges
          echo "CONFIG_RS=$PWD/build/bin/rust/config/generated_config.rs" >> "$GITHUB_ENV"

      - name: clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        working-directory: rust
        run: |
          export RUSTFLAGS="-C link-arg=$GITHUB_WORKSPACE/build/bin/rust/liblocal_bridge.a -C link-arg=$GITHUB_WORKSPACE/build/bin/rust/libconfig_bridge.a -C link-arg=$GITHUB_WORKSPACE/build/bin/rust/liblogger_bridge.a"
          cargo test --locked --workspace

      - name: NIO C interface is up to date
        run: git diff --exit-code -- rust/sql-nio/include/nio.h

      # Compile Windows code on Linux; this does not run Windows tests.
      - name: check windows target
        working-directory: rust
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          cargo check --locked --workspace --target x86_64-pc-windows-gnu

      - name: cargo audit
        working-directory: rust
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          cargo audit
