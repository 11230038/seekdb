[package]
name = "local"
version = "0.1.0"
edition = "2021"
publish = false
links = "local"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
kv = { path = "../kv" }
cxx = "1"
parquet = { version = "56.2.0", default-features = false, features = ["snap"] }
serde_json = "1"

[build-dependencies]
cxx-build = "1"
